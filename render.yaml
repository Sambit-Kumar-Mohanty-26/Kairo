# One blueprint, one service per folder. Render builds only the folder named by
# rootDir, so the Python ML service can join later without touching this one.
services:
  - type: web
    name: kairo-api
    runtime: node
    rootDir: api
    # free spins down after ~15 min idle, so the first request then takes ~50s.
    # Switch to starter when a cold start in a demo is unacceptable.
    plan: free
    # Migrations run in the build because preDeployCommand is paid-plans-only.
    # On a paid plan, move `npx prisma migrate deploy` into preDeployCommand:
    # it then runs after a successful build and before the new instance takes
    # traffic, rather than migrating even when the deploy later fails.
    buildCommand: npm ci && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL # Neon connection string (the pooled one)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS # exact Vercel origin, no trailing slash
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM # must be a domain verified in Resend
        sync: false

  - type: web
    name: kairo-ml
    runtime: python
    rootDir: ml
    # Measured, one uvicorn worker serving 2,000 flows: 257 MB resident and
    # flat, so free's 512 MB fits with room. What free costs is the 15-minute
    # spin-down — the next request then pays ~50s of wake plus 4s to unpickle,
    # which is why api/src/routes/ml.ts allows 60s. Move to starter for
    # always-on, not for memory. Two workers do not fit either way.
    plan: free
    # The artifact is gitignored, so the build downloads it. Set
    # KAIRO_MODEL_URL to a public model.joblib; the step fails the build if it
    # cannot get one, rather than shipping a service that 503s.
    buildCommand: pip install -r requirements.txt && python -m kairo_ml.fetch_model
    startCommand: uvicorn kairo_ml.service:app --host 0.0.0.0 --port $PORT
    # /health reports whether a model is loadable, not merely that Python is
    # up, so a modelless instance never takes traffic.
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH # src layout: kairo_ml is not importable without it
        value: src
      - key: PYTHON_VERSION # numpy 2.x and xgboost 3.x wheels; trained on this
        value: 3.13.1
      - key: KAIRO_MODEL_URL
        sync: false
      # Set only if the artifact is in a private repo or bucket; sent as a
      # bearer token on the one GET the build makes.
      - key: KAIRO_MODEL_TOKEN
        sync: false
      # Only kairo-api should reach this service, never a browser, so this is
      # the API's own origin *with* the scheme — fromService gives a bare
      # hostname, which would never match an Origin header. Server-to-server
      # calls send no Origin at all, so this is a browser lock, not the
      # authorisation: see the note on /ml in api/src/routes/ml.ts.
      - key: ALLOWED_ORIGINS
        sync: false
